name: Robot d'actualités

on:
  schedule:
    - cron: "7,37 * * * *"   # toutes les 30 min (GitHub peut retarder de quelques minutes)
  workflow_dispatch: {}      # bouton « Run workflow » pour un lancement manuel

permissions:
  contents: write
  pages: write

concurrency:
  group: newsbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests du robot
        run: |
          pip install --quiet pytest
          python -m pytest -q bot/tests

      - name: Lancer le robot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWSBOT_PUBLISH: ${{ vars.NEWSBOT_PUBLISH }}
        run: python bot/newsbot.py

      - name: Enregistrer les résultats
        id: commit
        run: |
          git config user.name "crashplane-newsbot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news
          if git diff --cached --quiet; then
            echo "Aucun changement."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Actualités : mise à jour automatique"
          for i in 1 2 3; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push --quiet origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Demander la mise en ligne (GitHub Pages)
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null && echo "Reconstruction de Pages demandée."
