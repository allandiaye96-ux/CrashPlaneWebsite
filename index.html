    "description": "<h3>Contexte</h3><p>À l’automne 1908, Orville Wright effectue une série de vols de démonstration pour l’Armée américaine à Fort Myer. Le lieutenant Thomas E. Selfridge, observateur invité, prend place comme passager.</p><h3>Déroulement</h3><p>Au cours d’un tour de piste, une pale d’hélice se fissure puis se brise, provoquant de fortes vibrations et l’endommagement des commandes. L’appareil perd de l’altitude et s’écrase après une tentative de retour vers le terrain.</p><h3>Causes</h3><p>Rupture d’hélice due à une faiblesse matérielle et aux contraintes vibratoires; défaillance consécutive des éléments de commande.</p><h3>Conséquences</h3><p>Selfridge décède des suites de ses blessures, devenant la première victime de l’aviation motorisée. L’événement conduit les Wright à renforcer la conception des hélices et les procédures d’essais.</p>"

    "description": "<p>En approche de Cali de nuit, l’équipage du B757 modifie la clairance et prépare une arrivée directe, dans un environnement radio chargé et avec un relief marqué. Une mauvaise sélection radio-navigation et une conscience situationnelle dégradée amènent l’avion hors de la trajectoire protégée.</p><p>La descente se poursuit dans la vallée sans références visuelles suffisantes. L’appareil heurte un relief près de Buga. L’enquête mettra en avant des facteurs de gestion du vol (FMS), la charge de travail et la communication ATC.</p><p>L’accident entraîne des améliorations de procédures, de bases de données FMS et de la gestion des approches non stabilisées, ainsi que de la formation à la conscience situationnelle terrain.</p>"
